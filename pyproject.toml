[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-red-team-lab"
version = "0.1.0"
description = "Deliberately vulnerable LLM chatbot plus an automated OWASP LLM Top 10 scanner (educational, synthetic data)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "anthropic>=0.40",
]

[project.scripts]
redteam = "scanner.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["target*", "scanner*"]

[tool.setuptools.package-data]
target = ["data/kb/*.md", "static/*.html"]
scanner = ["attacks/*.yaml", "canaries.yaml", "report/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
